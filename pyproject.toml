[project]
name = "sprc-runner"
version = "0.1.0"
description = "Аналог sprc-runner на Claude Agent SDK"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.16.0",
    "claude-agent-sdk==0.1.0",
]

[project.scripts]
sprc-runner = "sprc_runner:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["integration: проверки репозитория и инструментария на живом запуске"]
