# Зафиксированный эталон формата артефактов подготовки (BEH-09, FR-11).
# Путь и версия источника также заданы в sprc-runner.toml; проверка требует их совпадения.
# Q-06 (какой внешний скилл-источник) открыт: до ответа эталоном служит этот файл,
# а при выборе скилла меняются path/version и разделы ниже, не код проверки.
path = "schemas/prepare-artifacts-format.toml"
version = "1"

[spec]
title = true          # заголовок первого уровня `# ...`
min_sections = 1      # не меньше одного раздела `## ...`

[requirements]
title = true
min_sections = 1
id_pattern = "FR-\\d+"   # хотя бы одно требование с идентификатором

[tasks]
min_tasks = 1            # разметка записей — формат spec-runner (tasks_md)
